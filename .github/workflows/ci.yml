name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: PHP ${{ matrix.php }} static checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Run portable test entry point
        run: php tests/run.php

      - name: Check admin JavaScript syntax
        run: |
          node --check assets/js/cockpit-utm.js
          node --check assets/js/process-cockpit.js
          node tests/html-pattern.js
          node tests/utm-builder.js
